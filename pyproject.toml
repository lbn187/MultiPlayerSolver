[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lbn-mpsafe"
version = "0.3.0"
description = "Safe subgame resolving in multiplayer imperfect-information games"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]

[tool.setuptools]
packages = ["lbn_mpsafe"]

[tool.setuptools.package-data]
lbn_mpsafe = ["*.so"]
