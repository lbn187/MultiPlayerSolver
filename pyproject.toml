[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mpsafe"
version = "0.2.0"
description = "Safe subgame resolving in multiplayer imperfect-information games"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]

[tool.setuptools]
packages = ["mpsafe"]
